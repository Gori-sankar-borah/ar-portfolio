<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Research Portfolio A-Frame</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/aframe-rounded-component@1.0.4/dist/aframe-rounded-component.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Inter, Arial, sans-serif;
            background: #050816;
        }

        .overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .overlay h2 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .overlay p {
            margin: 6px 0 0;
            font-size: 13px;
            opacity: 0.75;
        }
    </style>
</head>

<body>

    <div class="overlay">
        <h2>Interactive Research Portfolio</h2>
        <p>WASD = Move | Mouse = Look Around</p>
    </div>

    <a-scene background="color: #050816"
        renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true" shadow="type: pcfsoft">

        <!-- ==================== ASSETS ==================== -->

        <a-assets>

            <!-- Publication Card Texture -->
            <canvas id="pubCanvas" width="1024" height="512"></canvas>

            <!-- Project Card Texture -->
            <canvas id="projectCanvas" width="1024" height="512"></canvas>

            <!-- Profile Texture -->
            <canvas id="profileCanvas" width="1024" height="1024"></canvas>

        </a-assets>


        <!-- ==================== LIGHTING ==================== -->

        <a-entity light="type: ambient; intensity: 0.8; color: #cdd6ff"></a-entity>

        <a-entity light="type: directional;
           intensity: 1.2;
           castShadow: true;
           shadowMapWidth: 2048;
           shadowMapHeight: 2048;
           color: #ffffff" position="2 8 4"></a-entity>

        <a-entity light="type: point;
           intensity: 1.6;
           distance: 30;
           decay: 2;
           color: #6ca8ff" position="0 5 2"></a-entity>


        <!-- ==================== FLOOR ==================== -->

        <a-plane rotation="-90 0 0" width="120" height="120" color="#0d1224" shadow="receive: true"
            material="roughness: 0.9; metalness: 0.05"></a-plane>


        <!-- ==================== ENVIRONMENT GLOW ==================== -->

        <a-ring position="0 8 -10" radius-inner="8" radius-outer="8.2" color="#5ba8ff"
            material="shader: flat; opacity: 0.25"></a-ring>


        <!-- ==================== CENTER PROFILE ==================== -->

        <a-entity position="0 2.4 -6">

            <!-- Main Card -->
            <a-plane width="4" height="5.5" material="src: #profileCanvas; transparent: true" rounded="radius: 0.18"
                shadow="cast: true"></a-plane>

            <!-- Outer Glow -->
            <a-plane width="4.25" height="5.75" position="0 0 -0.02" color="#4fa7ff"
                material="opacity: 0.12; shader: flat" rounded="radius: 0.22"></a-plane>

        </a-entity>


        <!-- ==================== PUBLICATIONS SECTION ==================== -->

        <a-entity position="-8 2 -8">

            <a-text value="PUBLICATIONS" color="#84bfff" width="12" align="left" position="-0.3 2.2 0"></a-text>


            <!-- Publication Card 1 -->
            <a-entity position="0 1.2 0">

                <a-plane width="5.6" height="1.6" material="src: #pubCanvas; transparent: true" rounded="radius: 0.12"
                    shadow="cast: true"
                    animation__hover="property: position; startEvents: mouseenter; to: 0 0.05 0; dur: 200"
                    animation__leave="property: position; startEvents: mouseleave; to: 0 0 0; dur: 200"></a-plane>

                <a-plane width="5.8" height="1.8" position="0 0 -0.01" color="#53a8ff"
                    material="opacity: 0.08; shader: flat" rounded="radius: 0.16"></a-plane>

            </a-entity>


            <!-- Publication Card 2 -->
            <a-entity position="0 -1 0">

                <a-plane width="5.6" height="1.6" material="src: #pubCanvas; transparent: true" rounded="radius: 0.12"
                    shadow="cast: true"></a-plane>

                <a-plane width="5.8" height="1.8" position="0 0 -0.01" color="#53a8ff"
                    material="opacity: 0.08; shader: flat" rounded="radius: 0.16"></a-plane>

            </a-entity>


            <!-- Publication Card 3 -->
            <a-entity position="0 -3.2 0">

                <a-plane width="5.6" height="1.6" material="src: #pubCanvas; transparent: true" rounded="radius: 0.12"
                    shadow="cast: true"></a-plane>

                <a-plane width="5.8" height="1.8" position="0 0 -0.01" color="#53a8ff"
                    material="opacity: 0.08; shader: flat" rounded="radius: 0.16"></a-plane>

            </a-entity>

        </a-entity>


        <!-- ==================== PROJECTS SECTION ==================== -->

        <a-entity position="8 2 -8">

            <a-text value="PROJECTS" color="#84bfff" width="12" align="right" position="0.3 2.2 0"></a-text>


            <!-- Project Card 1 -->
            <a-entity position="0 1.2 0">

                <a-plane width="5.6" height="1.6" material="src: #projectCanvas; transparent: true"
                    rounded="radius: 0.12" shadow="cast: true"></a-plane>

                <a-plane width="5.8" height="1.8" position="0 0 -0.01" color="#5ef2d6"
                    material="opacity: 0.08; shader: flat" rounded="radius: 0.16"></a-plane>

            </a-entity>


            <!-- Project Card 2 -->
            <a-entity position="0 -1 0">

                <a-plane width="5.6" height="1.6" material="src: #projectCanvas; transparent: true"
                    rounded="radius: 0.12" shadow="cast: true"></a-plane>

                <a-plane width="5.8" height="1.8" position="0 0 -0.01" color="#5ef2d6"
                    material="opacity: 0.08; shader: flat" rounded="radius: 0.16"></a-plane>

            </a-entity>


            <!-- Project Card 3 -->
            <a-entity position="0 -3.2 0">

                <a-plane width="5.6" height="1.6" material="src: #projectCanvas; transparent: true"
                    rounded="radius: 0.12" shadow="cast: true"></a-plane>

                <a-plane width="5.8" height="1.8" position="0 0 -0.01" color="#5ef2d6"
                    material="opacity: 0.08; shader: flat" rounded="radius: 0.16"></a-plane>

            </a-entity>

        </a-entity>


        <!-- ==================== PARTICLES ==================== -->

        <a-entity id="particles"></a-entity>


        <!-- ==================== CAMERA ==================== -->

        <a-entity position="0 1.6 4" movement-controls="speed: 0.18">
            <a-camera wasd-controls look-controls>
                <a-cursor color="#4fa7ff" fuse="false"></a-cursor>
            </a-camera>
        </a-entity>


    </a-scene>


    <script>

        // ==========================================
        // PROFILE CARD DESIGN
        // ==========================================

        const profileCanvas = document.getElementById('profileCanvas');
        const pctx = profileCanvas.getContext('2d');

        const profileGradient = pctx.createLinearGradient(0, 0, 1024, 1024);
        profileGradient.addColorStop(0, '#111827');
        profileGradient.addColorStop(1, '#1e293b');

        pctx.fillStyle = profileGradient;
        pctx.fillRect(0, 0, 1024, 1024);

        pctx.strokeStyle = 'rgba(120,180,255,0.35)';
        pctx.lineWidth = 8;
        pctx.strokeRect(24, 24, 976, 976);

        // Avatar Circle
        pctx.beginPath();
        pctx.arc(512, 250, 120, 0, Math.PI * 2);
        pctx.fillStyle = '#60a5fa';
        pctx.fill();

        pctx.fillStyle = '#ffffff';
        pctx.font = 'bold 64px Arial';
        pctx.textAlign = 'center';
        pctx.fillText('YOUR', 512, 520);

        pctx.font = 'bold 72px Arial';
        pctx.fillText('NAME', 512, 610);

        pctx.fillStyle = '#9fb7d9';
        pctx.font = '36px Arial';
        pctx.fillText('AI Researcher • Developer • Scientist', 512, 700);

        pctx.fillStyle = '#6ca8ff';
        pctx.fillRect(240, 760, 540, 3);

        pctx.fillStyle = '#d6e3ff';
        pctx.font = '30px Arial';
        pctx.fillText('Graph Neural Networks', 512, 840);
        pctx.fillText('Biomedical AI', 512, 890);
        pctx.fillText('Large Language Models', 512, 940);


        // ==========================================
        // PUBLICATION CARD DESIGN
        // ==========================================

        const pubCanvas = document.getElementById('pubCanvas');
        const pubctx = pubCanvas.getContext('2d');

        const pubGradient = pubctx.createLinearGradient(0, 0, 1024, 512);
        pubGradient.addColorStop(0, '#111827');
        pubGradient.addColorStop(1, '#172554');

        pubctx.fillStyle = pubGradient;
        pubctx.fillRect(0, 0, 1024, 512);

        pubctx.strokeStyle = 'rgba(96,165,250,0.4)';
        pubctx.lineWidth = 5;
        pubctx.strokeRect(12, 12, 1000, 488);

        pubctx.fillStyle = '#60a5fa';
        pubctx.fillRect(40, 50, 14, 400);

        pubctx.fillStyle = '#ffffff';
        pubctx.font = 'bold 44px Arial';
        pubctx.fillText('Publication Title Goes Here', 90, 120);

        pubctx.fillStyle = '#b9d4ff';
        pubctx.font = '28px Arial';
        pubctx.fillText('Journal / Conference Name • 2026', 90, 185);

        pubctx.fillStyle = '#dce9ff';
        pubctx.font = '26px Arial';
        pubctx.fillText('Deep Learning • Biomedical AI • Knowledge Graphs', 90, 260);

        pubctx.fillStyle = '#7dd3fc';
        pubctx.fillRect(90, 330, 260, 48);

        pubctx.fillStyle = '#03111f';
        pubctx.font = 'bold 24px Arial';
        pubctx.fillText('READ PAPER', 140, 362);


        // ==========================================
        // PROJECT CARD DESIGN
        // ==========================================

        const projectCanvas = document.getElementById('projectCanvas');
        const projctx = projectCanvas.getContext('2d');

        const projGradient = projctx.createLinearGradient(0, 0, 1024, 512);
        projGradient.addColorStop(0, '#111827');
        projGradient.addColorStop(1, '#062f2f');

        projctx.fillStyle = projGradient;
        projctx.fillRect(0, 0, 1024, 512);

        projctx.strokeStyle = 'rgba(94,242,214,0.4)';
        projctx.lineWidth = 5;
        projctx.strokeRect(12, 12, 1000, 488);

        projctx.fillStyle = '#5ef2d6';
        projctx.fillRect(40, 50, 14, 400);

        projctx.fillStyle = '#ffffff';
        projctx.font = 'bold 44px Arial';
        projctx.fillText('Project Name Goes Here', 90, 120);

        projctx.fillStyle = '#b7fff0';
        projctx.font = '28px Arial';
        projctx.fillText('Production AI System • Real-Time Analytics', 90, 185);

        projctx.fillStyle = '#d9fff8';
        projctx.font = '26px Arial';
        projctx.fillText('PyTorch • Transformers • APIs • CUDA', 90, 260);

        projctx.fillStyle = '#5ef2d6';
        projctx.fillRect(90, 330, 260, 48);

        projctx.fillStyle = '#001311';
        projctx.font = 'bold 24px Arial';
        projctx.fillText('VIEW PROJECT', 122, 362);


        // ==========================================
        // PARTICLE FIELD
        // ==========================================

        const particleContainer = document.querySelector('#particles');

        for (let i = 0; i < 160; i++) {

            const particle = document.createElement('a-sphere');

            const x = (Math.random() - 0.5) * 80;
            const y = Math.random() * 20;
            const z = -Math.random() * 80;

            const scale = Math.random() * 0.04 + 0.01;

            particle.setAttribute('position', `${x} ${y} ${z}`);

            particle.setAttribute('radius', scale);

            particle.setAttribute(
                'material',
                'color: #8dc6ff; emissive: #8dc6ff; emissiveIntensity: 1.5; shader: standard'
            );

            particle.setAttribute(
                'animation',
                `property: position;
       dir: alternate;
       dur: ${4000 + Math.random() * 4000};
       loop: true;
       to: ${x} ${y + Math.random() * 1.5} ${z}`
            );

            particleContainer.appendChild(particle);
        }

    </script>

</body>

</html>
