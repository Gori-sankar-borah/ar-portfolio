<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Gori Sankar Borah | Dark Mode Portfolio</title>
   
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>

    <a-scene loading-screen="enabled: false" shadow="type: pcfsoft">
        <a-assets>
            <a-asset-item id="pineTree" src="https://vazxmixjsiawhamofees.supabase.co/storage/v1/object/public/models/pine-tree/model.gltf"></a-asset-item>
        </a-assets>

      <a-entity environment="preset: forest; dressingAmount: 400; groundColor: #1a2a15;"></a-entity>
      
 
      <a-entity camera look-controls wasd-controls position="0 1.6 0">
        <a-entity cursor="fuse: false"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.02"
                  material="color: #00FF99; shader: flat; opacity: 0.7">
        </a-entity>
      </a-entity>

    
      <a-entity position="0 1.6 -3" 
                animation="property: position; to: 0 1.68 -3; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine">
       
        <a-plane width="4.1" height="2.1" position="0 0 -0.02" material="color: #00FF99; shader: flat; opacity: 0.1"></a-plane>
        
     
        <a-plane width="4" height="2" material="color: #050505; opacity: 0.8; transparent: true; metalness: 0.9; roughness: 0.1; shader: standard">
         
            <a-plane width="1.5" height="0.04" color="#00FF99" position="0 1 0.02" material="shader: flat"></a-plane>
            <a-plane width="1.5" height="0.04" color="#00FF99" position="0 -1 0.02" material="shader: flat"></a-plane>

            <a-entity line="start: -1.9 0.7 0.05; end: -1.9 0.9 0.05; color: #00FF99"></a-entity>
            <a-entity line="start: -1.9 0.9 0.05; end: -1.7 0.9 0.05; color: #00FF99"></a-entity>
            
            <a-entity line="start: 1.9 -0.7 0.05; end: 1.9 -0.9 0.05; color: #00FF99"></a-entity>
            <a-entity line="start: 1.9 -0.9 0.05; end: 1.7 -0.9 0.05; color: #00FF99"></a-entity>

            
            <a-text value="GORI SANKAR BORAH" align="center" color="#FFFFFF" width="8" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt" position="0 0.45 0.15"></a-text>
            <a-text value="CREATIVE DEVELOPER & ARCHITECT" align="center" color="#00FF99" width="3.2" font="kelsonsans" position="0 0.1 0.15"></a-text>
            
            <a-plane width="0.4" height="0.01" color="#444" position="0 -0.15 0.15"></a-plane>
            
            <a-text value="Designing the Future of the Spatial Web" align="center" color="#AAA" width="2.4" position="0 -0.4 0.15"></a-text>

        </a-plane>
      </a-entity>
      <a-entity position="-3.8 1.6 -2.5" rotation="0 35 0">
        
        <a-plane width="3" height="2.2" material="color: #000; opacity: 0.85; transparent: true; metalness: 0.6">
            
          
            <a-plane width="3" height="0.02" color="#00FF99" position="0 1.1 0.01"></a-plane>
            
     
            <a-text value="RESEARCH & PUBLICATIONS" align="center" color="#00FF99" width="4.5" position="0 0.85 0.1" font="kelsonsans"></a-text>
            
           
            <a-text value="[2024] Ames Test Prediction (ML)\nChemical Physics Letters" 
                    align="center" color="#FFF" width="2.2" position="0 0.5 0.1" line-height="50"></a-text>
            
           
            <a-text value="[2025] BoostDILI: Liver Injury Prediction\nChemical Research in Toxicology" 
                    align="center" color="#FFF" width="2.2" position="0 0.15 0.1" line-height="50"></a-text>
            
         
            <a-text value="[2026] LLM & Explainable AI (XAI)\nICDCIT Conference" 
                    align="center" color="#FFF" width="2.2" position="0 -0.2 0.1" line-height="50"></a-text>

            
            <a-text value="[2025] OMNI: Graph Attention (GAT)\nbioRxiv Pre-print" 
                    align="center" color="#FFF" width="2.2" position="0 -0.55 0.1" line-height="50"></a-text>

        
            <a-plane width="1.4" height="0.2" position="0 -0.9 0.1" color="#00FF99" material="opacity: 0.15">
                <a-text value="VIEW GOOGLE SCHOLAR" align="center" color="#00FF99" width="2"></a-text>
            </a-plane>
        </a-plane>
      </a-entity>

      
      <a-entity position="3.5 1.6 -2.2" rotation="0 -40 0">
        <a-plane width="2.5" height="1.8" material="color: #000; opacity: 0.85; transparent: true; metalness: 0.6">
            <a-plane width="2.5" height="0.02" color="#00FF99" position="0 0.9 0.01"></a-plane>
            
            <a-text value="PORTFOLIO" align="center" color="#00FF99" width="4.5" position="0 0.6 0.1"></a-text>
            
            <a-text value="* SPATIAL RESUME VR\n\n* SMART CITY TWIN\n\n* AR NAV TOOL" 
                    align="left" color="#FFF" width="2.6" position="-0.9 -0.1 0.1" line-height="55"></a-text>

            <a-plane width="1.2" height="0.25" position="0 -0.65 0.1" color="#00FF99" material="opacity: 0.15">
                <a-text value="LAUNCH HUB" align="center" color="#00FF99" width="2.2"></a-text>
            </a-plane>
        </a-plane>
      </a-entity>

     
      <a-light type="ambient" color="#00FF99" intensity="0.1"></a-light>
      <a-light type="point" position="0 3 -1" color="#00FF99" intensity="0.6"></a-light>
      <a-light type="point" position="-2 0 -2" color="#FFFFFF" intensity="0.3"></a-light>

    </a-scene>
  </body>
</html>
